name: Triage

on:
  # pull_request, not pull_request_target (changed 2026-11-18). From 2026-12-02
  # GitHub stops running pull_request_target workflows in public repositories
  # unless a repository event policy allows them:
  # https://github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2
  # The hive's GitHub App cannot create that policy. Its owner refused it the
  # Administration permission the policy needs, for security reasons, and the
  # alternative is a policy made by hand in every repository.
  #
  # Neither job needs pull_request_target. `paths` reads the changed-file list
  # through the API. `classify` runs scripts/classify_pr.py from the base commit,
  # then creates and edits labels with gh. Under pull_request a pull request
  # from this repository gets a write token as long as `permissions:` below
  # grants pull-requests: write. That includes Dependabot's: its runs start
  # read-only and the permissions key raises them (GitHub docs, "Dependabot on
  # GitHub Actions", "Changing GITHUB_TOKEN permissions").
  #
  # A pull request from a fork gets a read-only token here, so labelling it
  # would fail. Both jobs skip one with an `if:`, which shows a grey "skipped"
  # run instead of a red one.
  #
  # The workflow file and .github/labeler.yml now come from the pull request's
  # merge commit. The classify checkout stays pinned to the base commit, so the
  # classifier that runs with the write token is master's copy, not the pull
  # request's. A pull request from this repository can still edit this file;
  # its author already has write access.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paths:
    name: path labels
    # Fork pull requests get a read-only token; see the note under `on:`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply path labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9  # v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  classify:
    name: risk tier and size
    # Fork pull requests get a read-only token; see the note under `on:`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Explicit: never the pull request's head. Under pull_request the
          # default is the merge commit, which would run the pull request's
          # own classifier with the write token.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/classify_pr.py --pr "$PR" > classification.json
          cat classification.json

      - name: Apply the labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          wanted=$(python3 - <<'PY'
          import json

          result = json.load(open("classification.json"))
          for key in ("tier", "size"):
              entry = result.get(key)
              if entry:
                  print(f"{entry['name']}\t{entry['colour']}\t{entry['description']}")
          PY
          )

          # --force creates the label or updates an existing one, so it always
          # ends up with the colour and description from
          # .github/policies/risk-tiers.yml rather than a random generated colour.
          #
          # Not tolerant of failure on purpose: when this silently swallowed
          # errors, an over-long description produced an HTTP 422 here and then
          # an unrelated-looking "'tier/runtime' not found" from the add-label
          # call below. classify_pr.py now rejects a description GitHub would,
          # and this step reports anything else.
          while IFS=$'\t' read -r name colour description; do
            [ -n "$name" ] || continue
            gh label create "$name" --force --color "$colour" --description "$description"
          done <<< "$wanted"

          # A pull request has exactly one tier and one size. Drop any stale ones
          # left over from an earlier push before adding the current pair.
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          keep=$(cut -f1 <<< "$wanted" | paste -sd, -)

          for label in $current; do
            case "$label" in
              tier/*|size/*)
                if [[ ",$keep," != *",$label,"* ]]; then
                  gh pr edit "$PR" --remove-label "$label"
                fi
                ;;
            esac
          done

          gh pr edit "$PR" --add-label "$keep"
          echo "Applied: $keep" >> "$GITHUB_STEP_SUMMARY"
