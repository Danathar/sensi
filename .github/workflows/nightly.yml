name: Nightly compliance

on:
  schedule:
    # 06:17 UTC. Off the hour on purpose - GitHub's scheduler is heavily
    # contended at :00 and runs get delayed.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Both test jobs install and execute PyPI packages. Keep their token read-only;
# the dependency-free report job receives its issue scope below.
permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  pinned:
    name: pinned Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_component.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Record resolved versions
        run: |
          pip list --format=freeze \
            | grep -iE '^(homeassistant|pytest-cov|pytest-homeassistant-custom-component|python-socketio|ruff)=' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Requirements sync
        run: python3 scripts/check_requirements_sync.py

      - name: Tests with coverage
        run: |
          pytest \
            --cov=custom_components.sensi \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Propose a gate adjustment
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python3 scripts/auto_qa_tuner.py --markdown >> "$GITHUB_STEP_SUMMARY"
          fi

  latest:
    name: latest Home Assistant (advance warning)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational. Home Assistant ships every month and deprecates
    # aggressively; this leg is how that lands as a nightly notice rather than
    # as a user's broken installation. It must never gate a pull request, so its
    # failure is recorded rather than propagated.
    continue-on-error: true
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install the newest test harness
        # ruff is the one pinned tool the suite itself runs
        # (tests/test_agent_format_hook.py). It is installed from
        # requirements_test.txt the way validate.yml does, without installing
        # that file's Home Assistant pin.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_component.txt
          pip install --upgrade pytest-homeassistant-custom-component pytest-cov
          pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Record resolved versions
        run: |
          {
            echo "### Latest Home Assistant leg"
            echo
            pip list --format=freeze \
              | grep -iE '^(homeassistant|pytest-homeassistant-custom-component)='
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        id: run
        # -ra surfaces the warnings summary, which on this leg is the point:
        # a Home Assistant deprecation shows up here before it shows up as a
        # broken installation.
        run: pytest -q -ra

  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the only job that calls the issue API. Job-level permissions keep
    # that write scope out of the two jobs executing third-party dependencies.
    permissions:
      contents: read
      issues: write
    needs: [pinned, latest]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PINNED: ${{ needs.pinned.result }}
          LATEST: ${{ needs.latest.outputs.result }}
        run: |
          set -euo pipefail

          TITLE="Nightly compliance failing"
          # The advance-warning leg is `continue-on-error`, so the run stays green when
          # it fails. Its own issue is the only place that failure reaches anyone.
          LATEST_TITLE="Nightly latest Home Assistant leg failing"

          # Listed rather than searched, because the search index lags. Matched
          # by exact title and by author, because the repository is public and
          # anyone can open an issue with this title. gh reports the Actions
          # bot as `app/github-actions`; a person's login cannot contain a `/`.
          # Assigned before it is read, so a failed listing fails the step
          # under `set -eo pipefail`.
          open_issues="$(gh issue list --repo "$REPO" --state open --limit 1000 \
            --json number,title,author)"

          bot_issue() {
            jq -r --arg title "$1" \
              '[.[] | select(.title == $title and .author.login == "app/github-actions")]
               | sort_by(.number) | first | .number // empty' <<<"$open_issues"
          }

          existing="$(bot_issue "$TITLE")"
          latest_existing="$(bot_issue "$LATEST_TITLE")"

          # Only a leg that ran and failed is reported, and only one that ran and
          # passed closes the issue: an empty, skipped or cancelled leg says nothing
          # about Home Assistant either way.
          if [ "$LATEST" = "failure" ]; then
            latest_body=$(cat <<BODY
          The nightly leg that runs the suite against the **latest** Home Assistant
          and test harness failed. It never gates a pull request and the workflow run
          still shows as passed, so this issue is the only notice. Whatever failed
          here is what the next upgrade of the pinned Home Assistant will hit.

          - Latest-Home-Assistant leg: \`$LATEST\`
          - Run: $RUN_URL

          This issue is reused by later nightly runs and closes itself when that leg
          passes again.
          BODY
            )
            if [ -n "$latest_existing" ]; then
              gh issue comment "$latest_existing" --repo "$REPO" --body "$latest_body"
            else
              gh label create ci --repo "$REPO" --color 1d76db \
                --description "Continuous integration" >/dev/null 2>&1 || true
              gh issue create --repo "$REPO" --title "$LATEST_TITLE" --label ci \
                --body "$latest_body"
            fi
            echo "Latest-Home-Assistant leg failed; reported in its own issue." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$LATEST" = "success" ] && [ -n "$latest_existing" ]; then
            gh issue comment "$latest_existing" --repo "$REPO" \
              --body "The latest-Home-Assistant leg passed again as of [this run]($RUN_URL). Closing."
            gh issue close "$latest_existing" --repo "$REPO"
          fi

          if [ "$PINNED" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Nightly is green again as of [this run]($RUN_URL). Closing."
              gh issue close "$existing" --repo "$REPO"
            fi
            echo "Nightly green; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body=$(cat <<BODY
          The nightly compliance run failed against the **pinned** Home Assistant,
          which is the same configuration pull requests are gated on. Something
          broke without a code change - a transitive dependency, a yanked
          release, or an environment change.

          - Pinned leg: \`$PINNED\`
          - Latest-Home-Assistant leg: \`${LATEST:-not run}\`
          - Run: $RUN_URL

          This issue is reused by later nightly runs and closes itself when the
          run goes green again.
          BODY
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create ci --repo "$REPO" --color 1d76db \
              --description "Continuous integration" >/dev/null 2>&1 || true
            gh issue create --repo "$REPO" --title "$TITLE" --label ci --body "$body"
          fi
