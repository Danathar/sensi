name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter, rather than hiding the second failure behind
      # the first. The versions differ in how annotations are evaluated, so a
      # failure on one and not the other is a meaningful signal.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_component.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Record resolved versions
        run: |
          python -c "import homeassistant; print('homeassistant', homeassistant.__version__)"
          pip freeze | grep -iE '^(homeassistant|pytest-homeassistant-custom-component|python-socketio)=='

      - name: Run tests
        run: |
          pytest \
            --cov=custom_components.sensi \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
