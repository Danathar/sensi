name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        # Installed from requirements_test.txt so CI and the devcontainer agree
        # on the version.
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest with hassfest
        # Pinned to the tip of master as of 2026-09-06 (commit of 2026-08-03).
        # Upstream documents the mutable ref, but a branch ref resolves to
        # whatever someone else's repo says at run time -- same class as the
        # softprops pin in release.yml. Re-resolve deliberately to update.
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # HACS validates repository-level metadata as well as the integration -
    # topics, an enabled issue tracker, brands registration - none of which a
    # fork inherits from its parent. This fork has been given the topics and
    # issue tracker it checks for, so the job runs here too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate with HACS
        # Pinned to the tip of main as of 2026-09-06 (commit of 2026-06-08),
        # for the same reason as the hassfest pin above.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  requirements-sync:
    name: manifest requirements match requirements_component.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare manifest requirements against requirements_component.txt
        run: python3 scripts/check_requirements_sync.py
