name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        # Installed from requirements_test.txt so CI and the devcontainer agree
        # on the version.
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # HACS validates repository-level metadata as well as the integration -
    # topics, an enabled issue tracker, brands registration - none of which a
    # fork inherits from its parent. This fork has been given the topics and
    # issue tracker it checks for, so the job runs here too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  requirements-sync:
    name: manifest requirements match requirements_component.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare manifest requirements against requirements_component.txt
        run: python3 scripts/check_requirements_sync.py
