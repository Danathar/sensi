name: Release

# CalVer, YYYY.M.PATCH - 2026.9.0, 2026.9.1, 2026.10.0.
#
# This fork deliberately does NOT continue upstream's 2.x semver line. Upstream
# keeps publishing v2.1.7, v2.2.0 and so on from a different tree; sharing the
# numbering would mean two different releases called the same thing, and
# "I'm on 2.1.7" would stop identifying which code someone is running.
# A year-based line can never collide, and Home Assistant itself uses CalVer.
#
# Tags carry no "v" prefix, which is the other half of telling the two lines
# apart at a glance: upstream tags look like `v2.1.6`, ours like `2026.9.0`.
#
# The version lives in custom_components/sensi/manifest.json, and it is changed
# the way every other file here is changed: in a pull request, reviewed, and
# merged under the repository ruleset. This workflow never writes to master.
# It tags a commit that is already there and publishes it, so the number it
# releases is one that passed CI and review rather than one a workflow run
# invented and pushed past the rules that govern everyone else.
#
# Two jobs, and a run is only ever one of them:
#
#   * `prepare` opens the version-bump pull request and stops. Nothing is
#     tagged or published, and the only branch it pushes is a release/* one.
#   * `release` tags the manifest's version on the checked-out commit and
#     publishes it - monthly on a schedule, or by hand. Guarded; see
#     "Decide whether to release" below, because most months here change only
#     CI and docs, and a release users are prompted to install should contain
#     something they can observe.
#
# The version is never derived from commit messages. semantic-release cannot
# produce CalVer, and this repository has no tags for it to count from - its
# first release on a tagless repo would be 1.0.0, below the 2.1.6 already in
# the manifest.

on:
  schedule:
    # 09:00 UTC on the 1st. GitHub disables scheduled workflows after 60 days
    # with no repository activity, which is worth knowing but not a concern
    # while agents are opening pull requests here.
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      prepare:
        description: "Open the version-bump pull request instead of releasing"
        type: boolean
        default: false
      version:
        description: "CalVer YYYY.M.PATCH (e.g. 2026.9.0). Leave blank to derive it."
        required: false
      prerelease:
        description: "Publish as a pre-release (version must end b1, rc2, ...)"
        type: boolean
        default: false
      force:
        description: "Release even if nothing user-visible changed"
        type: boolean
        default: false
      dry_run:
        description: "Validate only - do not tag or publish"
        type: boolean
        default: false

# Nothing is granted workflow-wide; each job asks for what it needs, so a job
# added later cannot quietly inherit the ability to write to this repository.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The one definition of a release number, shared by both jobs so the check
  # guarding the pull request and the check guarding the tag cannot drift
  # apart. Four-digit year, unpadded 1-12 month, unpadded patch, and an
  # optional b1/rc1 pre-release suffix.
  CALVER_PATTERN: '^[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)((b|rc)[1-9][0-9]*)?$'

jobs:
  # ------------------------------------------------------------------------
  # Propose the next version. This is the only place the manifest changes, and
  # it changes through a pull request like anything else.
  # ------------------------------------------------------------------------
  prepare:
    name: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes a release/* branch and opens a pull request - never master. The
    # ruleset that governs master governs this pull request too, which is the
    # point: release automation must not become a second route around it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      # Derived from the date, not from commit messages: this month's line if
      # it has not been released yet, otherwise the next patch in it.
      - name: Decide the next version
        id: version
        env:
          # Through the environment, never interpolated into the script below.
          # `${{ }}` is substituted before bash parses the file, so an input
          # containing shell syntax would otherwise become part of the program
          # rather than data for it - and this job can write to the repository.
          GIVEN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          given="$GIVEN_VERSION"

          if [ -n "$given" ]; then
            # Checked before it is used for anything: as a branch name, as a
            # commit message, or written to $GITHUB_OUTPUT, where an unchecked
            # value carrying a newline forges outputs for later steps.
            if ! printf '%s' "$given" | grep -qE "$CALVER_PATTERN"; then
              echo "::error::'$given' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)," >&2
              echo "optionally with a b1/rc1 suffix for a pre-release." >&2
              echo "Month must not be zero-padded; no 'v' prefix." >&2
              exit 1
            fi
            version="$given"
            echo "Using the version given: $version"
          else
            month="$(date -u +%Y).$(date -u +%-m)"
            # `|| true` is load-bearing: with no tags yet, git prints nothing,
            # grep -v exits 1 on empty input, and pipefail turns that into a
            # failed step. The no-tags case is exactly the first release.
            latest="$(git tag --list "${month}.*" | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"

            if [ -z "$latest" ]; then
              version="${month}.0"
            else
              version="${month}.$(( ${latest##*.} + 1 ))"
            fi

            echo "Derived $version (latest this month: ${latest:-none})."
          fi

          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::Tag $version already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          manifest="custom_components/sensi/manifest.json"
          # jq, not sed: it cannot corrupt the JSON, and it fails loudly.
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          # The manifest path and the version reach python through the
          # environment too, rather than being pasted into its source.
          MANIFEST="$manifest" python3 -c "import json,os;assert json.load(open(os.environ['MANIFEST']))['version']==os.environ['VERSION']"
          git --no-pager diff -- "$manifest"

      - name: Open the pull request
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "::error::The manifest is already at $VERSION." >&2
            echo "If that version has not been released, run this workflow" >&2
            echo "without 'prepare' to tag and publish it." >&2
            exit 1
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/$VERSION"
          git checkout -b "$branch"
          git add custom_components/sensi/manifest.json
          git commit -s -m "chore(release): $VERSION"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(release): $VERSION" \
            --body "Sets the manifest version to \`$VERSION\`.

          Merging this is what approves the number. The Release workflow then
          tags the commit that lands and publishes it; it does not change the
          version itself."

          echo "Opened the version-bump pull request for **$VERSION**." >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------
  # Tag an approved commit and publish it. Reads the version; never sets it.
  # ------------------------------------------------------------------------
  release:
    name: release
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes a tag and creates a release; no step in this job writes a branch.
    # Granted explicitly so it does not inherit an organisation default and
    # does not widen if that changes.
    permissions:
      contents: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      # The scheduled path is opt-in. Merging this workflow must not, by
      # itself, start publishing releases to everyone on HACS; someone has to
      # decide that and set the variable. A manual run is always allowed -
      # a person is already in the loop.
      - name: Check the schedule is enabled
        id: enabled
        env:
          OPTED_IN: ${{ vars.AUTO_RELEASE_ENABLED == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OPTED_IN" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Monthly releases are off. Set the repository variable" >> "$GITHUB_STEP_SUMMARY"
            echo "\`AUTO_RELEASE_ENABLED\` to \`true\` to enable them." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A month whose only commits are CI and docs has nothing for a user to
      # install. Releasing anyway trains people to ignore the update prompt,
      # which is the one thing that has to keep working when a release does
      # matter. Roughly half the commits in this repository do not touch the
      # component, so this is the common case, not an edge one.
      - name: Decide whether to release
        id: decide
        if: steps.enabled.outputs.go == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # `|| true` is load-bearing: with no tags yet, git prints nothing,
          # grep -v exits 1 on empty input, and pipefail turns that into a
          # failed step. The no-tags case is exactly the first release.
          last="$(git tag --list '[0-9][0-9][0-9][0-9].*' | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"

          if [ -z "$last" ]; then
            echo "No previous release; this is the first."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$last"..HEAD -- custom_components/sensi | wc -l)"
          echo "Commits since $last touching the component: $changed file(s)."

          if [ "$changed" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No release"
              echo
              echo "Nothing under \`custom_components/sensi\` changed since **$last**."
              echo "Re-run by hand with \`force\` if you want one anyway."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # An automatic release publishes whatever is on master to everyone on
      # HACS without a person looking first. The least this can do is refuse
      # when master's own checks are not green.
      - name: Require green checks on this commit
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bad="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[]
                   | select(.name != "release")
                   | select((.conclusion // "pending") | IN("success","skipped","neutral") | not)
                   | "\(.name): \(.conclusion // .status)"] | .[]')"

          if [ -n "$bad" ]; then
            echo "::error::Not releasing - checks on ${GITHUB_SHA::12} are not green:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "All checks on ${GITHUB_SHA::12} are green."

      # The number comes off the merged manifest, not from this run. That file
      # changed in a reviewed pull request, which is what makes the version an
      # approved one; a workflow input can only confirm it, never choose it.
      - name: Decide the version
        id: version
        if: steps.decide.outputs.go == 'true'
        env:
          # Through the environment, never interpolated into the script below.
          # `${{ }}` is substituted before bash parses the file, so an input
          # containing shell syntax would otherwise become part of the program
          # rather than data for it - and this job holds contents: write.
          GIVEN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          given="$GIVEN_VERSION"
          version="$(python3 -c "import json;print(json.load(open('custom_components/sensi/manifest.json'))['version'])")"
          echo "The manifest on this commit says $version."

          # Validated here: after the transfer through the environment, and
          # before the value is compared, printed, or acted on.
          if [ -n "$given" ] && ! printf '%s' "$given" | grep -qE "$CALVER_PATTERN"; then
            echo "::error::'$given' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)," >&2
            echo "optionally with a b1/rc1 suffix for a pre-release." >&2
            echo "Month must not be zero-padded; no 'v' prefix." >&2
            exit 1
          fi

          # $GITHUB_OUTPUT is a file of key=value lines, so a value carrying a
          # newline forges outputs for every later step that reads them.
          # Nothing unchecked is written to it.
          if ! printf '%s' "$version" | grep -qE "$CALVER_PATTERN"; then
            echo "::error::the manifest version '$version' is not CalVer." >&2
            exit 1
          fi

          # An explicit input confirms the number; it does not choose it.
          # Typing one the manifest does not carry means one of the two is
          # wrong, and guessing which would publish the wrong thing.
          if [ -n "$given" ] && [ "$given" != "$version" ]; then
            echo "::error::asked for $given, but the manifest says $version." >&2
            echo "This workflow tags what master already carries; it does not" >&2
            echo "change the version. Run it with 'prepare' to open the" >&2
            echo "version-bump pull request for $given, and merge that first." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Everything that can be wrong is checked before anything is written.
      # A release is the one operation here that users can already have
      # consumed by the time a mistake is noticed: deleting a tag does not
      # un-download it from HACS.
      - name: Validate the version
        if: steps.decide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -qE "$CALVER_PATTERN"; then
            echo "::error::'$VERSION' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)," >&2
            echo "optionally with a b1/rc1 suffix for a pre-release." >&2
            echo "Month must not be zero-padded; no 'v' prefix." >&2
            exit 1
          fi

          # The `inputs` context is empty on a scheduled run - there are no
          # inputs to a cron trigger - so an absent checkbox is an unticked
          # one. Without this the monthly release compares "false" against ""
          # and refuses every stable version it was asked to publish.
          prerelease="$PRERELEASE"
          [ -n "$prerelease" ] || prerelease=false

          # The suffix and the checkbox have to agree. Either one alone is a
          # mistake that publishes the wrong kind of release: a stable tag
          # named 2026.9.0b1, or a beta that HACS offers to everyone.
          case "$VERSION" in
            *b[0-9]*|*rc[0-9]*) has_suffix=true ;;
            *) has_suffix=false ;;
          esac
          if [ "$has_suffix" != "$prerelease" ]; then
            echo "::error::version '$VERSION' and prerelease=$prerelease disagree." >&2
            echo "A pre-release version must end b1/rc1, and a stable one must not." >&2
            exit 1
          fi

          # The tag being free is also what proves the manifest moved: if this
          # number is already published, master is still carrying the version
          # of the last release and there is nothing new to tag.
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists, so the manifest has not" >&2
            echo "been bumped since that release. Run this workflow with" >&2
            echo "'prepare' to open the version-bump pull request, merge it," >&2
            echo "then release the commit that lands." >&2
            exit 1
          fi

          # Nothing between here and the tag changes the manifest, so this is
          # the file the tag will point at. Checked anyway: it is the single
          # invariant that makes tagging instead of committing safe.
          current="$(python3 -c "import json;print(json.load(open('custom_components/sensi/manifest.json'))['version'])")"
          if [ "$current" != "$VERSION" ]; then
            echo "::error::the manifest says $current, but $VERSION is being released." >&2
            exit 1
          fi

          # A release older than the one people already have is worse than no
          # release: HACS offers the newest version it can see, so a backwards
          # number either strands users or, worse, looks like an update.
          # Stable tags only - a beta may be "older" than the last stable, and
          # must never become the number a later stable is measured against.
          newest="$(git tag --list '[0-9][0-9][0-9][0-9].*' | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"
          echo "manifest: $current | newest stable tag: ${newest:-none} | releasing: $VERSION"

          if [ -n "$newest" ]; then
            older="$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | head -1)"
            if [ "$older" = "$VERSION" ]; then
              echo "::error::$VERSION is not newer than the latest tag $newest." >&2
              exit 1
            fi
          fi

      - name: Tag the approved commit
        if: steps.decide.outputs.go == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag is the only ref this workflow writes. The commit under it
          # is already on master, having gone through a pull request and the
          # ruleset, so a protected master needs no bypass for releases.
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      # A convenience asset for people installing by hand. HACS does NOT use
      # it - that needs "zip_release" and "filename" in hacs.json, which are
      # deliberately unset, so HACS installs custom_components/sensi/ from the
      # tag itself and there is only one thing to get wrong.
      - name: Build the manual-install ZIP
        if: steps.decide.outputs.go == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          mkdir -p release
          (cd custom_components/sensi && zip -qr "$GITHUB_WORKSPACE/release/sensi.zip" .)
          unzip -l release/sensi.zip | tail -3

      # Notes are generated from the merged pull requests since the last tag.
      # Keeping an upstream sync to a single merge commit is what stops
      # iprak's work being listed here as if it were this fork's - see
      # CONTRIBUTING.md, "Syncing with upstream".
      - name: Publish the release
        if: steps.decide.outputs.go == 'true' && !inputs.dry_run
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release/sensi.zip

      - name: Summarise
        if: steps.decide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: **$VERSION** is valid. Nothing was tagged or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released **$VERSION**." >> "$GITHUB_STEP_SUMMARY"
          fi
