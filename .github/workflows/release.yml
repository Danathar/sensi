name: Release

# CalVer, YYYY.M.PATCH - 2026.9.0, 2026.9.1, 2026.10.0.
#
# This fork deliberately does NOT continue upstream's 2.x semver line. Upstream
# keeps publishing v2.1.7, v2.2.0 and so on from a different tree; sharing the
# numbering would mean two different releases called the same thing, and
# "I'm on 2.1.7" would stop identifying which code someone is running.
# A year-based line can never collide, and Home Assistant itself uses CalVer.
#
# Tags carry no "v" prefix, which is the other half of telling the two lines
# apart at a glance: upstream tags look like `v2.1.6`, ours like `2026.9.0`.
#
# The version is an explicit input rather than derived from commit messages.
# semantic-release cannot produce CalVer, and deriving it here would mean two
# sources for the number. The changelog is still generated from the history -
# see `generate_release_notes` below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, CalVer YYYY.M.PATCH (e.g. 2026.9.0)"
        required: true
      prerelease:
        description: "Publish as a pre-release (version must end b1, rc2, ...)"
        type: boolean
        default: false
      dry_run:
        description: "Validate only - do not tag, push, or publish"
        type: boolean
        default: false

# Pushes a commit and a tag, and creates a release. Granted explicitly so it
# does not inherit an organisation default and does not widen if that changes.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Everything that can be wrong with the request is checked before
      # anything is written. A release is the one operation here that users
      # can already have consumed by the time a mistake is noticed: deleting
      # a tag does not un-download it from HACS.
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)((b|rc)[1-9][0-9]*)?$'; then
            echo "::error::'$VERSION' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)," >&2
            echo "optionally with a b1/rc1 suffix for a pre-release." >&2
            echo "Month must not be zero-padded; no 'v' prefix." >&2
            exit 1
          fi

          # The suffix and the checkbox have to agree. Either one alone is a
          # mistake that publishes the wrong kind of release: a stable tag
          # named 2026.9.0b1, or a beta that HACS offers to everyone.
          case "$VERSION" in
            *b[0-9]*|*rc[0-9]*) has_suffix=true ;;
            *) has_suffix=false ;;
          esac
          if [ "$has_suffix" != "${{ inputs.prerelease }}" ]; then
            echo "::error::version '$VERSION' and prerelease=${{ inputs.prerelease }} disagree." >&2
            echo "A pre-release version must end b1/rc1, and a stable one must not." >&2
            exit 1
          fi

          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists." >&2
            exit 1
          fi

          # A release older than the one people already have is worse than no
          # release: HACS offers the newest version it can see, so a backwards
          # number either strands users or, worse, looks like an update.
          current="$(python3 -c "import json;print(json.load(open('custom_components/sensi/manifest.json'))['version'])")"
          # Stable tags only: a beta is allowed to be "older" than the last
          # stable, and must never become the number a later stable is
          # measured against.
          newest="$(git tag --list '[0-9][0-9][0-9][0-9].*' | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1)"
          echo "manifest: $current | newest tag: ${newest:-none} | requested: $VERSION"

          if [ -n "$newest" ]; then
            older="$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | head -1)"
            if [ "$older" = "$VERSION" ]; then
              echo "::error::$VERSION is not newer than the latest tag $newest." >&2
              exit 1
            fi
          fi

      - name: Set the manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="custom_components/sensi/manifest.json"
          # jq, not sed: it cannot corrupt the JSON, and it fails loudly.
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          python3 -c "import json;assert json.load(open('$manifest'))['version']=='$VERSION'"
          git --no-pager diff -- "$manifest"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add custom_components/sensi/manifest.json
            git commit -m "chore(release): $VERSION"
          else
            echo "Manifest already at $VERSION; tagging the current commit."
          fi

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "refs/tags/$VERSION"

      # A convenience asset for people installing by hand. HACS does NOT use
      # it - that needs "zip_release" and "filename" in hacs.json, which are
      # deliberately unset, so HACS installs custom_components/sensi/ from the
      # tag itself and there is only one thing to get wrong.
      - name: Build the manual-install ZIP
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p release
          (cd custom_components/sensi && zip -qr "$GITHUB_WORKSPACE/release/sensi.zip" .)
          unzip -l release/sensi.zip | tail -3

      # Notes are generated from the merged pull requests since the last tag.
      # Keeping an upstream sync to a single merge commit is what stops
      # iprak's work being listed here as if it were this fork's - see
      # CONTRIBUTING.md, "Syncing with upstream".
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release/sensi.zip

      - name: Summarise
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: **$VERSION** is valid. Nothing was tagged or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released **$VERSION**." >> "$GITHUB_STEP_SUMMARY"
          fi
