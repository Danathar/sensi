# ACMM waivers — criteria satisfied where the file check cannot see them.
#
# The ACMM evaluation detects capability by looking for files, which cannot
# distinguish "never built this" from "deliberately moved this somewhere the
# file check cannot see". Each entry below states the second case: the
# capability exists, here is what provides it, here is why it is not here.
#
# A waiver cannot advance an ACMM level — level pass/fail is computed on
# detected criteria alone. The L4 entries restore an accurate reading of a
# level this repository meets. The L6 entries record two capabilities Hive
# provides outside this repository, and one rule set kept here at a path the
# check does not list. None of them claims a level this repository has not
# earned.
#
# See docs/SECURITY-AI.md and https://github.com/hivecommons/hive/issues/6263.

waivers:
  - id: acmm:ai-fix-workflow
    satisfied_by: hive
    reason: >
      The in-repo AI-fix path (.github/workflows/ai-fix.yml) was removed in
      PR #118. It duplicated what Hive already does at ACMM L4, and did it
      across a second trust boundary: a job holding contents/issues/
      pull-requests/id-token write plus ANTHROPIC_API_KEY, gated on a label
      the issue-filing bot applied to its own issues. Hive is now the sole
      autonomous path. See docs/SECURITY-AI.md, "One autonomous path, and it
      is Hive".

  - id: acmm:copilot-review-apply
    satisfied_by: hive
    reason: >
      Same removal — ai-fix.yml was the only file matching this criterion's
      patterns as well. Review feedback is applied by Hive, under the same
      single autonomous path. See docs/SECURITY-AI.md.

  - id: acmm:auto-issue-gen
    satisfied_by: hive
    reason: >
      Issues are already generated automatically. Hive agents decide what to
      file against this repository (the ACMM gap issues #418 to #425 were
      filed that way). Separately, the report job in
      .github/workflows/nightly.yml opens, updates and closes one fixed
      Nightly compliance failing issue; it runs no model and decides nothing.
      The criterion asks for a general issue generator in this repository,
      a workflow or a script. Running one that chooses what to file would be
      a second autonomous path next to Hive, of the kind PR #118 removed. See
      docs/SECURITY-AI.md, "One autonomous path, and it is Hive".

  - id: aef:audit-trail
    satisfied_by: hive
    reason: >
      Hive's audit log records agent_issue_created and agent_pr_created
      events, each naming the repository, the issue or pull request number,
      the agent, the backend and the model. Hive also signs what it opens
      here: a footer naming the agent, backend and model on its pull
      requests, and the agent on its issues. A person merges, as
      docs/SECURITY-AI.md requires. The files this criterion accepts are an
      in-repository audit workflow or script, which would duplicate a record
      Hive already keeps outside this repository; see docs/SECURITY-AI.md,
      "One autonomous path, and it is Hive".

  - id: acmm:risk-assessment-config
    satisfied_by: .github/policies/risk-tiers.yml
    reason: >
      Risk assessment is configured in this repository, at a path the
      criterion does not list. .github/policies/risk-tiers.yml holds the tier
      and size rules, scripts/classify_pr.py applies them, the Triage
      workflow labels every pull request with the result, and
      docs/risk-tiers.md explains each tier. PR #269 moved the rules into
      .github/policies/ deliberately, as policy-as-code. A copy under one of
      this criterion's file names would be a second source of truth that
      nothing reads. docs/SECURITY-AI.md points readers at docs/risk-tiers.md
      for which paths carry which consequence.
