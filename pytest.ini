# Minimal pytest configuration.
#
# The devcontainer image supplies a pyproject.toml (gitignored here as "these
# come from the image"), so outside that image the suite had no configuration
# at all. pytest-homeassistant-custom-component requires asyncio_mode=auto -
# under the default strict mode every test that touches the autouse
# configure_event_loop fixture errors out during setup.
[pytest]
asyncio_mode = auto
testpaths = tests
